problemEn: Different games need different rules and controls. The challenge was to support that variety without asking hosts to learn a new operating flow for every activity.
problemAr: مع اختلاف الألعاب، تتغير القواعد وطريقة التفاعل. كان التحدي أن يستوعب بُعد هذا التنوع دون أن يضطر الهوست لتعلّم طريقة إدارة جديدة مع كل فعالية.
contextEn: BU'D brings Question & Condition and Mini Games to Arabic-speaking Discord communities. I owned the product and design decisions, directed development with ChatGPT, Codex and curated references, and reviewed the implementation.
contextAr: بُعد منصة عربية لفعاليات مجتمعات ديسكورد، تضم «سؤال وشرط» و«ميني قيمز». صممت تجربة المنتج واتخذت قراراته، ثم قدت التطوير وراجعت التنفيذ باستخدام ChatGPT وCodex ومراجع اخترتها للعمل.
processEn: I kept the stages around gameplay consistent. Rules and controls change inside the event screen; the surrounding hosting flow stays familiar.
processAr: وحّدت المراحل من التجهيز إلى الختام. تتغير قواعد اللعب داخل شاشة الفعالية، بينما تبقى الخطوات المحيطة بها مألوفة.
decisionsEn: 'I focused on the decisions hosts make during an event: staying in control, knowing what comes next and finding guidance when it is needed.'
decisionsAr: 'ركزت قرارات التصميم على ما يحتاجه الهوست وقت الفعالية: تحكم مباشر، وخطوة تالية واضحة، وشرح يظهر في مكانه.'
outcomeEn: 'BU''D is live, with published activities tried by community members. Host observations and participant reactions inform further refinement. Shipped improvements include clearer round restarts, session recovery, results and winner/prize feedback.


  The key lesson was to standardize the hosting flow while leaving game mechanics free to differ. A familiar next step does not require every activity to feel the same.'
outcomeAr: 'بُعد منتج منشور، وتُجرّب فعالياته مع أفراد المجتمع. أستفيد من ملاحظات الهوست وتفاعل المشاركين لتحديد ما يستحق التحسين. شملت التحسينات وضوح إعادة الجولة واستعادة الجلسة وعرض النتائج والفائزين والجوائز.


  تعلمت أن اتساق الرحلة لا يعني تشابه الألعاب. يمكن للهوست أن يعرف خطوته التالية، وتبقى لكل فعالية تجربتها الخاصة.'
