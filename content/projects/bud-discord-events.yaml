- section: decisions
  layout: decisions
  items:
  - titleAr: الهوست يقود اللعب
    titleEn: Keep the host in control
    bodyAr: في «سؤال وشرط» أبقيت الحكم على الإجابات وتسجيل الفائز بيد الهوست. يشارك اللاعب من ديسكورد دون حساب إضافي أو بوت يتتبعه، ويمكن للشخص نفسه أن يفوز أكثر من مرة.
    bodyEn: For Question & Condition, I kept answer judgment and winner entry with the host. Participants join through Discord without another website account or tracking bot, and the same person can win again.
  - titleAr: الشرح عند البداية
    titleEn: Put guidance beside the action
    bodyAr: أزلت زر المعلومات المنفصل من بطاقات «ميني قيمز»، واخترت نافذة بدء اللعبة مكانًا للشرح. القرار يجمع المعلومة مع لحظة الحاجة إليها؛ وتبقى صياغة الشرح نفسها قيد المراجعة.
    bodyEn: I removed separate information buttons from Mini Games cards and chose the existing start dialog for instructions. This places guidance beside the decision to play; the instruction copy remains under review.
  - titleAr: التفاعل يوجّه التحسين
    titleEn: Use feedback to guide iteration
    bodyAr: استفدت من ملاحظات الهوست وتفاعل المشاركين لتحسين منطق اللعب بهدف زيادة التنافسية والمتعة. هذه الملاحظات توجّه قراراتي، دون أن أنسب لها زيادة رقمية غير موثقة.
    bodyEn: Host observations and participant reactions informed changes to gameplay logic aimed at more competitive, enjoyable play. They guide design decisions without implying a measured uplift.
