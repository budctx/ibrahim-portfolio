problemEn: |-
  The design opportunity was to bring Discord community event operations into a clearer host-led experience, from selecting an activity and preparing the session to playing, recording winners, revealing prizes, and closing the event. The design needed to support different games without making every activity a separate, unfamiliar workflow.
problemAr: |-
  كانت الفرصة التصميمية هي تنظيم تشغيل فعاليات مجتمعات ديسكورد ضمن تجربة واضحة يقودها الهوست؛ من اختيار الفعالية وتجهيزها إلى اللعب وتسجيل الفائزين وكشف الجوائز والختام. وكان التحدي هو دعم ألعاب مختلفة دون تحويل كل فعالية إلى رحلة تشغيل منفصلة وغير مألوفة.
contextEn: |-
  BU'D is an Arabic-language product for interactive Discord events. For Question & Condition, the host judges answers and records winners manually; players participate through their community without website registration or a tracking bot. Mini Games expands the platform with six distinct game modes while retaining the common event journey.

  I directed the product and UX decisions independently, using ChatGPT, Codex, and selected references to assist development. No other human programmers were involved, according to my account.
contextAr: |-
  بُعد منتج عربي للفعاليات التفاعلية داخل مجتمعات ديسكورد. في فعالية «سؤال وشرط» يحكم الهوست على الإجابات ويسجل الفائزين يدويًا، ويشارك اللاعبون من مجتمعهم دون إنشاء حسابات بالموقع أو الاعتماد على بوت لتتبعهم. وأضيفت «ميني قيمز» بست ألعاب مختلفة مع الحفاظ على رحلة الفعالية المشتركة.

  توليت قرارات المنتج وتجربة المستخدم بشكل مستقل، واستعنت بـ ChatGPT وCodex ومراجعي المختارة لتطويره، دون مشاركة مبرمجين آخرين.
processEn: |-
  I defined a repeatable host flow: setup → event screen → prizes → closing. I reviewed how game-specific rules and controls could fit inside that shared journey, then iterated on interaction details through prototypes, AI-assisted implementation, QA reviews, and real event use.

  Feedback comes directly from event hosts and from observing participant interactions. I use those qualitative signals to identify UX improvements and development opportunities. This is an informal feedback practice, not a claimed formal usability study or statistically representative survey.
processAr: |-
  حددت رحلة تشغيل قابلة للتكرار للهوست: الإعداد ← شاشة الفعالية ← الجوائز ← الختام. وراجعت كيف يمكن لقواعد الألعاب وتحكمها الخاص أن يعمل داخل المراحل المشتركة، ثم حسّنت تفاصيل التفاعل باستخدام النماذج والتطوير المدعوم بالذكاء الاصطناعي ومراجعات الجودة والتجارب الفعلية.

  أحصل على الملاحظات مباشرة من الهوست، أو عبر متابعة تفاعل المشاركين. وأستخدم هذه الإشارات النوعية لتحديد فرص تحسين تجربة المستخدم وتطوير المنتج. هذه ممارسة ملاحظات مباشرة، وليست ادعاءً بدراسة استخدام رسمية أو استطلاع إحصائي ممثل.
decisionsEn: |-
  01 — Host-controlled gameplay. I chose manual judgment and winner entry for Question & Condition rather than participant registration and bot tracking. Repeat winner names remain possible through distinct winner records.

  02 — Shared event structure. I kept setup, live hosting, winners, prizes and closing consistent across activities, while letting every game have its own mechanics and controls.

  03 — Contextual game starts. I removed redundant information buttons from Mini Games cards and directed explanatory guidance toward each game's existing start modal. The explanatory copy itself remains subject to review, so I do not claim it as finished.

  04 — Feedback-informed mechanics. I used host feedback and observed participant interaction to refine gameplay logic with the intention of encouraging more competitive and enjoyable play, without naming a particular game or claiming a measured increase.
decisionsAr: |-
  01 — تحكم الهوست. اخترت التحكيم وإدخال الفائز يدويًا في «سؤال وشرط» بدل تسجيل المشاركين وتتبعهم بالبوت، مع دعم تكرار الأسماء عبر سجلات فوز مستقلة.

  02 — مراحل مشتركة. وحّدت الإعداد والتشغيل وتسجيل الفائزين والجوائز والختام بين الفعاليات، مع الإبقاء على قواعد وتحكم مختلفين لكل لعبة.

  03 — بداية اللعبة في سياقها. أزلت أزرار المعلومات المنفصلة من بطاقات «ميني قيمز»، واعتمدت مودال بداية اللعبة كمكان مناسب للشرح. نصوص الشرح نفسها ما زالت بحاجة إلى مراجعة، ولا أصفها بأنها مكتملة.

  04 — تحسين المنطق من التفاعل. استفدت من ملاحظات الهوست وتفاعل المشاركين لتحسين منطق اللعب بهدف زيادة التنافسية والمتعة، دون تحديد لعبة بعينها أو الادعاء بزيادة مقاسة.
outcomeEn: |-
  BU'D is operating as a live product. I report that published activities are tried with real community members and that host observations and participant reactions inform ongoing refinement.

  A traceable Mini Games improvement release was recorded on 11 November 2026 (PR #123 and CI/deployment evidence). The documented changes included clearer restart confirmations, restored-session handling, result states and winner/prize feedback. Successful release checks do not mean every project acceptance gate is closed.

  No verified conversion lift, engagement increase, satisfaction score, time savings, or user count is claimed here. This case study remains an editorial draft until real screenshots and a final disclosure review are complete.
outcomeAr: |-
  بُعد منتج يعمل حاليًا. وبحسب تجربتي، تُجرّب الفعاليات المنشورة مع مستخدمين حقيقيين، وتساعدني ملاحظات الهوست وتفاعل المشاركين على تحسين المنتج باستمرار.

  وُثّق نشر مجموعة تحسينات لـ«ميني قيمز» في 11 نوفمبر 2026 عبر PR #123 وسجلات الاختبارات والنشر، وشملت وضوح تأكيد إعادة الجولات واستعادة الجلسات وحالات النتائج وملاحظات الفائزين والجوائز. نجاح اختبارات الإصدار لا يعني إغلاق جميع بوابات اعتماد المشروع.

  لا أنسب للمنتج أي نسب غير مثبتة في التحويل أو التفاعل أو الرضا أو توفير الوقت أو أعداد المستخدمين. تبقى هذه دراسة حالة تحريرية غير منشورة إلى حين إضافة صور حقيقية ومراجعة حدود عرض البيانات.
