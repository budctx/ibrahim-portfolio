summaryEn: An Arabic platform for Discord game nights. I designed a consistent hosting flow that gives each game room to feel different.
summaryAr: فعاليات تجمع المجتمع، ورحلة واضحة لمن يديرها. صممت بُعد ليحتفظ الهوست بتحكمه، وتحتفظ كل لعبة بشخصيتها.
evidenceNoteEn: Screenshots show the public catalog and trials. Host feedback and participant reactions are qualitative inputs to iteration, rather than measured research outcomes.
