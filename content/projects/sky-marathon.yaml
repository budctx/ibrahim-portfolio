  items:
  - titleAr: المعرّف يكفي
    titleEn: One member identity
    bodyAr: حذفت أسماء المشاركين من رحلة الرصد والعرض والتصدير بناءً على احتياج التشغيل. المعرّف هو الرابط الثابت بين نتائج العضو، وتبقى أسماء الإداريين للمساءلة.
    bodyEn: Participant names were removed from entry, display and export to match the operating need. Discord ID is the stable link between results; administrator names remain for accountability.
  - titleAr: الخطأ في موضعه
    titleEn: Put errors where they occur
    bodyAr: يرتبط التنبيه بالحقل غير الصحيح، وينتقل التركيز إلى أول خطأ. التكرار بين فائز ومشارك يمنع المراجعة، بينما تُستبعد التكرارات داخل قائمة المشاركين مع توضيحها.
    bodyEn: Feedback attaches to the invalid field and focuses the first error. A winner/participant conflict blocks review; repeats within the participant list are deduplicated with notice.
  - titleAr: إنجاز واضح وخطوة تالية
    titleEn: Show completion and the next step
    bodyAr: يعرض نجاح الرصد عدد الأعضاء والنقاط مع إجراء لفتح الترتيب. تختفي رسالة العملية السابقة عند بدء تعديل جديد حتى لا تختلط بنتيجة المسودة الحالية.
    bodyEn: Completion reports member count and processed points with a link to standings. Editing a new draft clears the previous completion message so the states do not get confused.
