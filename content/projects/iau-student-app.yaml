  items:
  - titleAr: الأولوية قبل كثرة المعلومات
    titleEn: Priorities before volume
    bodyAr: قدمت الحالة الأكاديمية والتنبيهات والمحاضرة والمهمة التالية في الرئيسية، ثم تركت التفاصيل لمساراتها. هذا الترتيب يوضح ما يستحق الانتباه أولًا.
    bodyEn: The home view surfaces academic status, alerts, the next class and the next task. Detail belongs in its own flow, keeping immediate priorities visible.
  - titleAr: اختصارات بحد واضح
    titleEn: Keep shortcuts bounded
    bodyAr: يختار الطالب أربعة اختصارات للخدمات وثلاثة للروابط المهمة في النموذج. التخصيص يمنحه مساحة للاختيار ضمن حدود تحافظ على وضوح الرئيسية.
    bodyEn: The prototype allows four service shortcuts and three important links. Bounded personalization gives students choice without overwhelming the home view.
  - titleAr: التفاصيل عند الحاجة
    titleEn: Reveal details in context
    bodyAr: يرتبط عرض معلومات المحاضر ببطاقة المحاضرة، وتظهر السجلات الأكاديمية عبر البحث واختيار الفصل. الوصول للتفصيل يبدأ من سؤال الطالب، لا من عرض كل المعلومات دفعة واحدة.
    bodyEn: Lecturer details open from the class card; academic records use search and term selection. Detail follows the student’s question rather than appearing all at once.
