summaryAr: تصور لتطبيق يجمع خدمات الطالب ومعلوماته الأكاديمية حول يومه واحتياجه، بدل التنقل بين وجهات متفرقة.
summaryEn: A dedicated student-app concept that organizes scattered academic information and service access around the student’s day.
problemAr: لم تكن المشكلة غياب الخدمات، بل تفرّقها. كانت معلومات الطالب ومساراته موزعة بين خدمات الطلاب وBlackboard والملف الشخصي ومواضع أخرى. المطلوب تصور لتطبيق مخصص يجمع هذه التجربة.
problemEn: The services existed, but the experience was fragmented. Student information and access paths were distributed across Student Services, Blackboard, the personal profile and other university areas. The brief called for a dedicated student-app concept.
contextAr: أعددت التصور والنموذج التفاعلي ضمن عملي في قسم التطبيقات بجامعة الإمام عبدالرحمن بن فيصل. راجعت النسخ مع مديري، وأدخلت التعديلات والإضافات، وشاركت رابطًا حيًا لمتابعة التقدم. بعد المراجعات، سلّمت النسخة للمطورين وبدأوا العمل عليها.
contextEn: I developed the concept and interactive prototype through my work in IAU’s Applications Department. I reviewed iterations with my manager, incorporated requested changes and additions, and shared a live preview for progress reviews. I then handed the revised prototype to developers, who began implementation.
processAr: 'بدأت من احتياجات الطالب اليومية: ما الذي يحتاج انتباهه؟ أين محاضرته التالية؟ وكيف يصل إلى الخدمة أو المعلومة الأكاديمية؟ النموذج يتيح مناقشة هذه المسارات وتجربتها قبل ربطها بالأنظمة الفعلية.'
processEn: 'I organized the concept around everyday questions: what needs attention, where is the next class, and how can a student reach the relevant service or academic information? The prototype makes those paths tangible before production integrations.'
decisionsAr: جمعت الخدمات ضمن مدخل واحد، ثم اخترت متى تظهر التفاصيل ومتى تبقى مختصرة. الهدف أن يجد الطالب ما يحتاجه دون أن تتحول الرئيسية إلى قائمة لكل شيء.
decisionsEn: A single entry point still needs hierarchy. I chose which information to surface immediately and which details to reveal in context, so the home view would not become a directory of everything.
outcomeAr: 'المخرج نموذج تفاعلي خضع للمراجعة والتعديل، ثم سُلّم للتطوير. يعرض اتجاهًا موحدًا للتجربة، وليس تطبيقًا جامعيًا منشورًا أو تكاملًا مكتملًا مع الأنظمة.


  تعلمت أن النموذج القابل للتجربة يساعد على مناقشة السلوك والتسلسل، لا شكل الشاشات فقط. وتبقى مراجعة اتساق البيانات والمسميات وحالات الاستخدام جزءًا مهمًا من الانتقال إلى التنفيذ.'
outcomeEn: 'The deliverable is a reviewed, iterated prototype handed to engineering. It demonstrates a unified experience direction, rather than a launched university application or completed system integrations.


  The takeaway was the value of discussing behavior and sequence through a working prototype. Consistent labels, data and edge states still need attention as the concept moves into implementation.'
evidenceNoteAr: الصور من النموذج الذي سُلّم للتطوير، وتقتصر على تخصيص الخدمات والجدول دون عرض هوية طالب أو درجاته. المراجعات والتسليم موثقان بوصف صاحب المشروع؛ لا توجد نتائج استخدام رقمية أو شهادة امتثال.
evidenceNoteEn: Images come from the handed-off prototype and show service selection and the schedule without a student identity or grades. Stakeholder review and handoff reflect the owner’s account. No numerical usage outcomes or compliance certification are claimed.
