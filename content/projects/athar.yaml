  items:
  - titleAr: المحتوى يحدد الأولوية
    titleEn: Let content set the hierarchy
    bodyAr: أبقيت الهوية والمسمى في المقدمة، ثم المهارات والروابط وإجراءات التواصل. البطاقة تعرّف بصاحبها قبل أن تطلب من الزائر الاختيار بين روابطه.
    bodyEn: Identity and role lead, followed by skills, links and contact actions. The card introduces its owner before asking visitors to choose a destination.
  - titleAr: كل لغة تقرأ بطبيعتها
    titleEn: Respect each language
    bodyAr: راجعت اتجاه الحقول والتسميات وتناسق الوضعين الفاتح والداكن. الروابط والأرقام تحتفظ باتجاهها داخل الواجهة العربية.
    bodyEn: I reviewed field direction, labels and light/dark consistency. Links and numbers retain their reading direction inside the Arabic interface.
  - titleAr: إغلاق واضح دون فقدان العمل
    titleEn: Keep dismissal predictable
    bodyAr: 'اعتمدت سلوكًا مشتركًا للنوافذ: انتقال التركيز داخلها، وإغلاقها بـEscape، ثم عودته إلى الزر الذي فتحها، مع الحفاظ على تنبيه التعديلات غير المحفوظة.'
    bodyEn: Dialogs share focus containment, Escape dismissal and return focus to the opener. Unsaved-change warnings remain where edits could be lost.
