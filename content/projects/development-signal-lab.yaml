decisionsEn: Mark the item as development content, keep it in draft, and leave public-display permissions disabled.
decisionsAr: تمييز العنصر كمحتوى تطويري وإبقاؤه كمسودة وتعطيل صلاحيات العرض العام.
outcomeEn: A safe test record that validates the content pipeline without appearing as real portfolio work.
