name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Audit portfolio design system
        run: node scripts/css-audit.mjs
      - name: Build
        run: npm run build
      - name: Install Stage 18 QA browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Run Stage 18 responsive accessibility QA
        run: |
          npm run start > /tmp/portfolio-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          npx playwright test \
            tests/stage18-accessibility.spec.cjs \
            tests/stage18-axe.spec.cjs \
            tests/stage18-performance.spec.cjs \
            --reporter=line --workers=1

  graphic-gallery:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: preview
      GRAPHIC_GALLERY_FIXTURES: '1'
      GALLERY_BASE_URL: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint public/portfolio/*.js
      - run: node tests/gallery-content.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Gallery browser, accessibility and responsive tests
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3101 > /tmp/gallery-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3101/work/graphic-design > /dev/null; then break; fi
            sleep 1
          done
          npm run test:gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphic-gallery-qa
          path: |
            test-results/
            docs/gallery/evidence/

  existing-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run unchanged Stage 18 tests independently of audit gate
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/legacy-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/stage18-accessibility.spec.cjs tests/stage18-axe.spec.cjs tests/stage18-performance.spec.cjs --reporter=json --workers=1 > legacy-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-regression-qa
          path: |
            legacy-results.json
            test-results/
