name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Audit portfolio design system
        run: node scripts/css-audit.mjs
      - name: Build
        run: npm run build
  graphic-gallery:
    runs-on: ubuntu-24.04
    env:
      VERCEL_ENV: preview
      GRAPHIC_GALLERY_FIXTURES: '1'
      GALLERY_BASE_URL: http://127.0.0.1:3101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint public/portfolio/*.js
      - run: node tests/gallery-content.test.cjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Gallery browser, accessibility and responsive tests
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3101 > /tmp/gallery-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3101/work/graphic-design > /dev/null; then break; fi
            sleep 1
          done
          # The public preview must never be indexable.
          curl -fsSI http://127.0.0.1:3101/ | tr -d '\r' | grep -iq '^x-robots-tag: noindex, nofollow, noarchive'
          npm run test:gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphic-gallery-qa
          path: |
            test-results/
            docs/gallery/evidence/

  existing-regressions:
    # Keep the existing job ID for required-check continuity.
    # Historical tests/stage18-*.spec.cjs target a superseded .cv* homepage;
    # tests/portfolio-production.spec.cjs covers the actual live scene system.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Install Chromium for current production regression
        run: npx playwright install --with-deps chromium
      - name: Run bilingual scene, responsive, keyboard and accessibility regression
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/current-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3000/ > /dev/null; then
            cat /tmp/current-next.log
            exit 1
          fi
          npx playwright test tests/portfolio-production.spec.cjs --reporter=line --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: current-production-regression-failures
          path: test-results/
