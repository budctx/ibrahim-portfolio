name: One-shot refresh of security dependency lockfile
on:
  push:
    branches:
      - maintenance/ci-security-20261104
    paths:
      - package.json
      - .github/workflows/refresh-lock-20261104.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve lockfile without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify expected pinned dependencies
        run: |
          node - <<'NODE'
          const p = require('./package-lock.json');
          const version = name => p.packages['node_modules/' + name]?.version;
          if (version('next') !== '16.4.4') throw new Error('Next version mismatch');
          if (version('sharp') !== '0.35.5') throw new Error('Sharp version mismatch');
          if (version('source-map-js') !== '1.2.2') throw new Error('source-map-js version mismatch');
          console.log(JSON.stringify({ next: version('next'), sharp: version('sharp'), sourceMap: version('source-map-js') }));
          NODE
      - name: Commit only refreshed lockfile to maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "security: refresh locked dependency graph"
            git push origin HEAD:maintenance/ci-security-20261104
          fi
