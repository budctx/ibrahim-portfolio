ground:#242a33;box-shadow:0 1px 1px #fff9}.card-top{font:10px Arial;display:flex;justify-content:space-between;letter-spacing:1.5px;margin-bottom:10px;direction:ltr}.portrait{height:177px;flex-shrink:0;border-radius:3px;background:linear-gradient(145deg,#26354b,#141a24);display:grid;place-items:center;position:relative;overflow:hidden}.monogram{font-family:Arial,sans-serif;font-weight:700;font-size:106px;letter-spacing:-13px;padding-right:10px;color:#edf0f4;transform:rotate(-7deg)}.portrait small{position:absolute;bottom:10px;left:12px;font:9px Arial;letter-spacing:2px;color:#c4ccd6}.name{font-size:22px;font-weight:700;line-height:1.4;margin:13px 0 2px}.job{font:11px Arial;letter-spacing:.4px;direction:ltr;text-align:start;margin:0}.card-bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:end;direction:ltr;padding-top:11px}.barcode{height:21px;width:75px;background:repeating-linear-gradient(90deg,#222831 0 2px,transparent 2px 4px,#222831 4px 5px,transparent 5px 8px)}.card-bottom small{font:8px Arial;letter-spacing:1px}.back .insert{padding:27px 18px}.back h2{font-size:26px;line-height:1.3;margin:0 0 24px}.skill{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #2228312a;font-size:13px}.skill b{font:10px Arial;opacity:.65}.back-footer{margin-top:auto;font:11px Arial;line-height:1.8;direction:ltr}.footer{position:absolute;bottom:32px;left:5%;right:5%;display:flex;align-items:end;justify-content:space-between;color:#b5bdc8;font-size:12px;z-index:3}.identity{font-size:14px;color:#e0e4e9}.identity small{display:block;font-size:11px;color:#aab2bf;margin-top:8px}.hint{display:flex;align-items:center;gap:9px}.hint:before{content:'';width:18px;height:24px;border:1px solid #b5bdc866;border-radius:5px;transform:rotate(-9deg)}.motion{width:auto;padding:0 16px;border-radius:24px;font-size:12px}.paused .pendulum{animation-play-state:paused}.paused .role{animation-duration:.01s}@keyframes words{from{opacity:0;transform:translate /* Flow layout: text and the complete badge motion envelope own separate tracks. */
.hero{height:auto;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.header{position:relative;inset:auto;height:auto;min-height:88px;gap:20px;padding:20px 5%}

.stage .role.one{grid-column:1;grid-row:1;align-self:end;margin-bottom:36px}
.stage .role.two{grid-column:3;grid-row:1;align-self:end;margin-bottom:36px}
.stage .role.three{grid-column:1;grid-row:2;align-self:start;margin-top:36px}

const card=document.getElementById('card'),language=document.getElementById('language');let flipped=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,lang='ar',userInteracted=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function flip(){flipped=!flipped;card.style.setProperty('--flip',flipped?'180deg':'0deg');card.setAttribute('aria-pressed',String(flipped));card.querySelector('.front').setAttribute('aria-hidden',String(flipped));card.querySelector('.back').setAttribute('aria-hidden',String(!flipped))}
card.addEventListener('click',()=>{userInteracted=true;flip()});
function syncMotion(){document.querySelector('.hero').classList.toggle('paused',paused)}syncMotion();
language.addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang].replace(/\\n/g,'\n'));language.textContent=lang==='ar'?'E':'ع';language.setAttribute('aria-label',lang==='ar'?'Switch to English':'التحويل للعربية');card.setAttribute('aria-label',lang==='ar'?'اقلب بطاقة إبراهيم العجمي':'Flip Ibrahim’s card');document.querySelector('.stage').setAttribute('aria-label',lang==='ar'?'بطاقة التعريف التفاعلية':'Interactive identity card');syncMotion()});
setTimeout(()=>{if(!paused&&!userInteracted&&!reduce.matches){flip();setTimeout(()=>{if(!paused&&!userInteracted)flip()},2100)}},2600);
card.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!paused&&!reduce.matches){const r=card.getBoundingClientRect();card.style.setProperty('--tilt-x',((.5-(e.clientY-r.top)/r.height)*8)+'deg')}});card.addEventListener('pointerleave',()=>card.style.setProperty('--tilt-x','0deg'));
reduce.addEventListener('change',e=>{if(e.matches){paused=true;syncMotion()}});
</script></body></html>
