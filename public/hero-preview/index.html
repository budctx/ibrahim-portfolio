const card=document.getElementById('card'),motion=document.getElementById('motion'),language=document.getElementById('language');let flipped=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,lang='ar',userInteracted=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function flip(){flipped=!flipped;card.style.setProperty('--flip',flipped?'180deg':'0deg');card.setAttribute('aria-pressed',String(flipped));card.querySelector('.front').setAttribute('aria-hidden',String(flipped));card.querySelector('.back').setAttribute('aria-hidden',String(!flipped))}
card.addEventListener('click',()=>{userInteracted=true;flip()});
function motionLabel(){motion.textContent=paused?(lang==='ar'?'تشغيل الحركة':'Play motion'):(lang==='ar'?'إيقاف الحركة':'Pause motion');motion.setAttribute('aria-pressed',String(paused));document.querySelector('.hero').classList.toggle('paused',paused)}motionLabel();motion.addEventListener('click',()=>{paused=!paused;motionLabel()});
